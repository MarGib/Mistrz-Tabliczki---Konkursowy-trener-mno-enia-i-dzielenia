name: Publikacja na GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zainstaluj zależności
        run: npm install --no-audit --no-fund

      - name: Utwórz konfigurację Firebase z sekretu (opcjonalnie)
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
        run: |
          if [ -n "$FIREBASE_APPLET_CONFIG" ]; then
            printf '%s' "$FIREBASE_APPLET_CONFIG" > firebase-applet-config.json
            echo "Konfiguracja Firebase utworzona."
          else
            echo "::warning::Brak sekretu FIREBASE_APPLET_CONFIG — strona zostanie zbudowana bez logowania i synchronizacji w chmurze."
          fi

      - name: Zbuduj aplikację (Vite)
        run: npm run build

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj artefakt GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
